<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR // PRINT STICKER HEADER</title>
    <!-- โหลดไลบรารีสำหรับสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030806;
            --panel-bg: rgba(7, 24, 16, 0.95);
            --border-neon: #00ff88;
            --border-dim: #113a24;
            --text-main: #e2f0ea;
            --neon-green: #00ff88;
            --neon-blue: #00e5ff;
            --neon-red: #ff3366;
            --neon-yellow: #f5a623;
        }

        body {
            font-family: 'Sarabun', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border-neon);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        /* ปุ่ม Home App */
        .home-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            font-family: inherit;
        }
        .home-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .header-title {
            color: var(--neon-green);
            text-align: center;
            border-bottom: 1px dashed var(--border-neon);
            padding-bottom: 15px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .filter-section {
            background: #071710;
            border: 1px solid var(--border-dim);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-title {
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8ca89a;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #0b2218;
            border: 1px solid var(--border-dim);
            color: #00ffaa;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        input[type="text"] {
            cursor: text;
        }
        select {
            cursor: pointer;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
            background: #0e2b1f;
        }

        select:disabled {
            background: #05120d;
            color: #5d7568;
            cursor: not-allowed;
        }

        input[list]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(5) hue-rotate(90deg);
            cursor: pointer;
        }

        .btn-add {
            padding: 12px 20px;
            background: var(--neon-blue);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .btn-add:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            transform: translateY(-2px);
        }

        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            min-height: 40px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px dashed var(--border-dim);
        }

        .order-tag {
            background: #0b2218;
            border: 1px solid var(--neon-yellow);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 8px rgba(245, 166, 35, 0.1);
        }

        .order-tag strong {
            color: var(--neon-yellow);
        }

        .order-tag i {
            color: var(--neon-red);
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
            padding: 2px;
        }

        .order-tag i:hover {
            transform: scale(1.3);
        }

        .empty-text {
            color: #5d7568;
            font-size: 14px;
            font-style: italic;
            width: 100%;
            text-align: center;
            margin: 0;
            line-height: 40px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button.btn-action {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-preview {
            background: rgba(0, 229, 255, 0.1);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }
        .btn-preview:hover { background: var(--neon-blue); color: var(--bg-dark); box-shadow: 0 0 15px rgba(0,229,255,0.4); }

        .btn-print {
            background: linear-gradient(135deg, #071910, #040e09);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .btn-print:hover:not(:disabled) { background: var(--neon-green); color: var(--bg-dark); box-shadow: 0 0 15px rgba(0,255,136,0.4); }
        .btn-print:disabled { opacity: 0.5; cursor: not-allowed; }

        #statusMsg {
            text-align: center;
            margin-top: 15px;
            color: #f5a623;
            font-size: 14px;
        }

        /* ========================================================= */
        /* CSS สำหรับพิมพ์ (Print Media) */
        /* ========================================================= */
        #printArea { display: none; }

        @media print {
            /* ซ่อนปุ่มต่างๆ และหน้าจอหลักเวลาสั่งพิมพ์ */
            body * { visibility: hidden; }
            .no-print { display: none !important; }
            body { margin: 0; padding: 0; background: #fff; }
            #printArea, #printArea * { visibility: visible; color: #000 !important; }
            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            @page { size: A4 landscape; margin: 5mm; }

            .page-break { page-break-after: always; }

            .sticker-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(4, 46mm);
                gap: 4mm;
                width: 287mm;
                height: 198mm;
                box-sizing: border-box;
            }

            .sticker-card {
                border: 1px dashed #999;
                padding: 3mm 4mm;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: #fff;
                overflow: hidden;
            }

            .sticker-header-top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .sticker-title h3 {
                margin: 0 0 4px 0;
                font-size: 14px;
                text-align: center;
                font-weight: bold;
                border-bottom: 2px solid #000;
                padding-bottom: 2px;
                margin-bottom: 4px;
            }

            .meta-row {
                font-size: 12px;
                margin-bottom: 4px;
                display: flex;
                align-items: flex-end;
                gap: 4px;
                font-weight: bold;
            }

            .meta-label { white-space: nowrap; margin-bottom: -1px; }
            
            .meta-value {
                border-bottom: 1.5px dotted #000;
                padding-left: 5px;
                min-height: 15px;
                white-space: nowrap; 
            }

            .qr-box { text-align: center; margin-left: 5mm; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            /* ปรับขนาดการแสดงผลให้ใหญ่ขึ้นเล็กน้อย (70px) เพื่อสแกนง่ายขึ้น */
            .qr-box canvas, .qr-box img { width: 70px !important; height: 70px !important; margin: 0 auto; image-rendering: pixelated; }
            .qr-text-top { display: block; font-size: 8px; font-weight: bold; margin-top: 2px; }
            .qr-code-display { 
                font-size: 14px; 
                font-weight: bold; 
                letter-spacing: 2px; 
                margin-top: 2px; 
                background: #eee; 
                border: 1px solid #000; 
                padding: 2px; 
            }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ปุ่ม Home App (ซ่อนตอนพรินต์) -->
    <div class="no-print" style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <a href="https://paiboon-creater.github.io/Data_Information_Jaguar_productions/" class="home-btn">
            <i class="fa-solid fa-house"></i> HOME APP
        </a>
    </div>

    <div class="header-title">
        <h2><i class="fa-solid fa-print"></i> พิมพ์สติ๊กเกอร์หัวกระดาษ (เลือกเฉพาะขั้นตอนได้)</h2>
    </div>

    <div id="statusMsg"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูลระบบ...</div>

    <form id="filterForm" style="display: none;">
        
        <div class="filter-section">
            <div class="filter-title"><i class="fa-solid fa-list-check"></i> ค้นหาและระบุรายการที่ต้องการพิมพ์</div>
            
            <div class="form-row">
                <div class="form-group" style="flex: 1.5;">
                    <label>1. ค้นหา/เลือกเลขที่ใบสั่งงาน</label>
                    <input type="text" id="order_search" list="order_datalist" placeholder="-- พิมพ์ค้นหา หรือเลือกจากรายการ --" onchange="handleOrderSelect()" onclick="this.select()" autocomplete="off">
                    <datalist id="order_datalist"></datalist>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>2. เลือกขั้นตอน (เฉพาะใบนี้)</label>
                    <select id="select_step" disabled>
                        <option value="">-- รอเลือกใบสั่งงาน --</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0.5;">
                    <button type="button" class="btn-add" onclick="addSelectedItem()">
                        <i class="fa-solid fa-plus"></i> เพิ่มรายการ
                    </button>
                </div>
            </div>

            <div class="selected-list" id="selectedList">
                <p class="empty-text">ยังไม่มีรายการที่ถูกเลือก...</p>
            </div>
        </div>

        <div class="action-buttons">
            <button type="button" class="btn-action btn-preview" onclick="preparePrintData()"><i class="fa-solid fa-file-export"></i> ดึงข้อมูล / สร้างสติ๊กเกอร์</button>
            <button type="button" class="btn-action btn-print" id="btnPrint" onclick="window.print()" disabled><i class="fa-solid fa-print"></i> สั่งพิมพ์ทันที</button>
        </div>
        <div id="printCountMsg" style="text-align: center; margin-top: 10px; color: var(--neon-blue); font-weight: bold;"></div>
    </form>
</div>

<div id="printArea"></div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    
    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
    };

    let globalData = { orders: [], targets: [], workItems: [], steps: [], orderSteps: [], shortcutMap: [] };
    let selectedItems = []; 

    async function fetchSafeData(endpoint) {
        try {
            const res = await fetch(SUPABASE_URL + endpoint, { headers });
            if (!res.ok) return []; 
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (err) {
            console.warn("Fetch failed for endpoint:", endpoint, err);
            return [];
        }
    }

    document.addEventListener("DOMContentLoaded", async function() {
        try {
            const [orders, targets, workItems, steps, orderSteps] = await Promise.all([
                fetchSafeData("/orders?select=*"),
                fetchSafeData("/targets?select=*"),
                fetchSafeData("/work_items?select=*"),
                fetchSafeData("/production_steps?select=*"),
                fetchSafeData("/order_steps?select=*")
            ]);

            if (orders.length === 0) {
                document.getElementById('statusMsg').innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> ไม่พบข้อมูลใบสั่งงาน หรือการเชื่อมต่อฐานข้อมูลมีปัญหา";
                return;
            }

            globalData.orders = orders;
            globalData.targets = targets;
            globalData.workItems = workItems;
            globalData.steps = steps;
            globalData.orderSteps = orderSteps;

            globalData.orders.sort((a, b) => String(a.order_no || '').trim().localeCompare(String(b.order_no || '').trim(), 'th', { numeric: true }));

            generateShortcutMap();
            populateOrderSearch();

            document.getElementById('statusMsg').style.display = 'none';
            document.getElementById('filterForm').style.display = 'block';

        } catch (error) {
            console.error("Critical Error on load:", error);
            document.getElementById('statusMsg').innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> ระบบขัดข้อง: " + error.message;
        }
    });

    function generateShortcutMap() {
        globalData.shortcutMap = [];
        let sortedOrders = [...globalData.orders].sort((a,b) => parseInt(a.id_order || 0) - parseInt(b.id_order || 0));
        
        sortedOrders.forEach(order => {
            if (order.id_work) {
                let orderTargets = globalData.targets.filter(t => String(t.id_work) === String(order.id_work));
                orderTargets.sort((a,b) => parseInt(a.id_target || 0) - parseInt(b.id_target || 0));
                
                orderTargets.forEach((target, index) => {
                    let orderPart = String(order.id_order).padStart(3, '0');
                    let stepPart = String(index + 1).padStart(2, '0');
                    
                    globalData.shortcutMap.push({
                        code: orderPart + stepPart, 
                        id_order: order.id_order,
                        id_target: target.id_target
                    });
                });
            }
        });
    }

    function populateOrderSearch() {
        const datalist = document.getElementById('order_datalist');
        datalist.innerHTML = '';
        
        globalData.orders.forEach(o => {
            if (o.order_no) {
                let opt = document.createElement('option');
                opt.value = String(o.order_no).trim();
                datalist.appendChild(opt);
            }
        });

        if (globalData.orders.length > 0) {
            const latestOrder = globalData.orders[globalData.orders.length - 1]; 
            if (latestOrder && latestOrder.order_no) {
                document.getElementById('order_search').value = String(latestOrder.order_no).trim();
                handleOrderSelect(); 
            }
        }
    }

    function handleOrderSelect() {
        const orderSearchVal = document.getElementById('order_search').value.trim();
        const stepSelect = document.getElementById('select_step');
        
        stepSelect.innerHTML = '<option value="">-- รอเลือกใบสั่งงาน --</option>';
        stepSelect.disabled = true;

        if (!orderSearchVal) return;

        const order = globalData.orders.find(o => String(o.order_no || '').trim() === orderSearchVal);
        
        if (!order || !order.id_work) {
            stepSelect.innerHTML = '<option value="">-- ไม่พบการตั้งค่า หรือชิ้นงานในใบนี้ --</option>';
            return;
        }

        const orderTargets = globalData.targets.filter(t => String(t.id_work) === String(order.id_work));
        orderTargets.sort((a,b) => parseInt(a.id_target || 0) - parseInt(b.id_target || 0));

        if (orderTargets.length > 0) {
            stepSelect.innerHTML = '<option value="ALL">-- เลือกทุกขั้นตอน -- (พิมพ์หมด)</option>';
            
            orderTargets.forEach(t => {
                let stepName = `ID ขั้นตอน: ${t.id_target}`;
                if (t.id_step) {
                    const s = globalData.steps.find(step => String(step.id_step) === String(t.id_step));
                    if (s) stepName = s.step_name;
                }
                let opt = document.createElement('option');
                opt.value = t.id_target;
                opt.textContent = stepName;
                stepSelect.appendChild(opt);
            });
            stepSelect.disabled = false;
        } else {
            stepSelect.innerHTML = '<option value="">-- ไม่พบขั้นตอนการทำงาน --</option>';
        }
    }

    function addSelectedItem() {
        const orderSearchVal = document.getElementById('order_search').value.trim();
        const stepSelect = document.getElementById('select_step');
        const targetId = stepSelect.value;
        
        if (!orderSearchVal) {
            alert("กรุณาค้นหา/เลือกเลขที่ใบสั่งงานก่อนครับ");
            return;
        }
        if (!targetId) {
            alert("กรุณาเลือกขั้นตอนที่ต้องการพิมพ์ครับ");
            return;
        }

        const orderObj = globalData.orders.find(o => String(o.order_no || '').trim() === orderSearchVal);
        if (!orderObj) {
            alert("ไม่พบข้อมูลใบสั่งงานนี้ในระบบ");
            return;
        }
        
        if (targetId === "ALL") {
            Array.from(stepSelect.options).forEach(opt => {
                if (opt.value !== "ALL" && opt.value !== "") {
                    addItemToArray(orderObj, opt.value, opt.textContent);
                }
            });
        } else {
            const stepName = stepSelect.options[stepSelect.selectedIndex].text;
            addItemToArray(orderObj, targetId, stepName);
        }
        
        renderSelectedList();
        
        stepSelect.value = '';
        stepSelect.focus();
    }

    function addItemToArray(orderObj, targetId, stepName) {
        const exists = selectedItems.find(i => String(i.id_order) === String(orderObj.id_order) && String(i.id_target) === String(targetId));
        if (!exists) {
            selectedItems.push({
                id_order: orderObj.id_order,
                order_no: String(orderObj.order_no).trim(),
                id_target: targetId,
                step_name: stepName
            });
        }
    }

    function removeItem(index) {
        selectedItems.splice(index, 1);
        renderSelectedList();
    }

    function renderSelectedList() {
        const container = document.getElementById('selectedList');
        container.innerHTML = '';

        if (selectedItems.length === 0) {
            container.innerHTML = '<p class="empty-text">ยังไม่มีรายการที่ถูกเลือก...</p>';
            return;
        }

        selectedItems.forEach((item, index) => {
            const tag = document.createElement('div');
            tag.className = 'order-tag';
            tag.innerHTML = `<span><strong>${item.order_no}</strong> | ${item.step_name}</span> <i class="fa-solid fa-xmark" title="ลบออก" onclick="removeItem(${index})"></i>`;
            container.appendChild(tag);
        });
    }

    function formatDateStr(dateInput) {
        if (!dateInput) return ''; 
        let d = new Date(dateInput);
        return !isNaN(d) ? `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}` : '';
    }

    function preparePrintData() {
        if (selectedItems.length === 0) {
            alert("⚠️ กรุณาเพิ่มรายการลงในช่องรายการที่ถูกเลือกก่อนครับ");
            return;
        }
        buildStickers(selectedItems);
    }

    function buildStickers(itemsList) {
        const printArea = document.getElementById('printArea');
        printArea.innerHTML = ''; 

        let stickersHtmlData = []; 
        const baseUrl = "https://paiboon-creater.github.io/Data_Information_Jaguar_productions/daily_production.html";

        itemsList.forEach(item => {
            const orderObj = globalData.orders.find(o => String(o.id_order) === String(item.id_order));
            const targetObj = globalData.targets.find(t => String(t.id_target) === String(item.id_target));
            
            if (!orderObj || !targetObj) return; 

            let workCodeText = "";
            if (orderObj.id_work) {
                const foundW = globalData.workItems.find(w => String(w.id_work) === String(orderObj.id_work));
                if (foundW) workCodeText = foundW.work_code;
            }

            const orderNo = orderObj.order_no ? String(orderObj.order_no).trim() : '';
            const quantity = orderObj.quantity ? parseInt(orderObj.quantity).toLocaleString() + ' ชิ้น' : '';

            let stepStartDateStr = "";
            let stepEndDateStr = "";

            if (targetObj.id_step) {
                const orderStepObj = globalData.orderSteps.find(os => String(os.id_order) === String(orderObj.id_order) && String(os.id_step) === String(targetObj.id_step));
                if (orderStepObj) {
                    stepStartDateStr = formatDateStr(orderStepObj.start_date);
                    stepEndDateStr = formatDateStr(orderStepObj.end_date);
                }
            }

            const shortcutObj = globalData.shortcutMap.find(s => String(s.id_order) === String(orderObj.id_order) && String(s.id_target) === String(targetObj.id_target));
            const printCode = shortcutObj ? shortcutObj.code : "";
            const currentUrl = `${baseUrl}?order_id=${encodeURIComponent(orderObj.id_order)}&target_id=${encodeURIComponent(targetObj.id_target)}`;

            let html = `
                <div class="sticker-card">
                    <div class="sticker-header-top">
                        <div style="flex-grow: 1; overflow: hidden;">
                            <div class="sticker-title"><h3>ใบความก้าวหน้าของการผลิต</h3></div>
                            <div class="meta-row">
                                <span class="meta-label">ใบสั่งงานเลขที่:</span> 
                                <span class="meta-value" style="flex: 1.4;">${orderNo}</span>
                                <span class="meta-label" style="margin-left: 10px;">ขั้นตอน:</span> 
                                <span class="meta-value" style="flex: 1.2; font-size: 11px;">${item.step_name}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-label">ชนิดงาน:</span> 
                                <span class="meta-value" style="flex: 1;">${workCodeText}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-label">จำนวนสั่งผลิต:</span> 
                                <span class="meta-value" style="flex: 1;">${quantity}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-label">วันที่เริ่ม:</span> <span class="meta-value" style="flex: 1;">${stepStartDateStr}</span>
                                <span class="meta-label" style="margin-left: 10px;">วันที่เสร็จ:</span> <span class="meta-value" style="flex: 1;">${stepEndDateStr}</span>
                            </div>
                        </div>
                        <div class="qr-box">
                            <div class="qrcode-target" data-url="${currentUrl}"></div>
                            <span class="qr-text-top">สแกน / รหัสพิมพ์</span>
                            <div class="qr-code-display">[ ${printCode} ]</div>
                        </div>
                    </div>
                </div>
            `;
            stickersHtmlData.push({ html: html, url: currentUrl });
        });

        let pageHtml = '';
        const stickersPerPage = 8;
        const totalPages = Math.ceil(stickersHtmlData.length / stickersPerPage);

        for (let p = 0; p < totalPages; p++) {
            pageHtml += `<div class="sticker-grid ${p < totalPages - 1 ? 'page-break' : ''}">`;
            
            let startIdx = p * stickersPerPage;
            let endIdx = startIdx + stickersPerPage;
            
            for (let i = startIdx; i < endIdx; i++) {
                if (i < stickersHtmlData.length) {
                    pageHtml += stickersHtmlData[i].html;
                } else {
                    pageHtml += `<div style="border: 1px dashed transparent;"></div>`; 
                }
            }
            pageHtml += `</div>`;
        }

        printArea.innerHTML = pageHtml;

        const qrElements = document.querySelectorAll('.qrcode-target');
        qrElements.forEach((el, index) => {
            if (stickersHtmlData[index]) {
                new QRCode(el, {
                    text: stickersHtmlData[index].url,
                    width: 150, /* ขยายขนาดการ Render ให้ใหญ่และชัด 100% ป้องกันจุดเบียดกัน */
                    height: 150,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.L /* ลด Level Error Correction เพื่อให้บล็อก QR โล่งขึ้น */
                });
            }
        });

        document.getElementById('btnPrint').disabled = false;
        document.getElementById('printCountMsg').innerText = `✅ สร้างเสร็จแล้ว! พร้อมพิมพ์จำนวน ${stickersHtmlData.length} ดวง (${totalPages} แผ่น)`;
    }
</script>

</body>
</html>
