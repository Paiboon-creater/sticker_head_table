<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR // PRINT STICKER HEADER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030806;
            --panel-bg: rgba(7, 24, 16, 0.95);
            --border-neon: #00ff88;
            --border-dim: #113a24;
            --text-main: #e2f0ea;
            --neon-green: #00ff88;
            --neon-blue: #00e5ff;
            --neon-red: #ff3366;
            --neon-yellow: #f5a623;
        }

        body {
            font-family: 'Sarabun', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border-neon);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .header-title {
            color: var(--neon-green);
            text-align: center;
            border-bottom: 1px dashed var(--border-neon);
            padding-bottom: 15px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .filter-section {
            background: #071710;
            border: 1px solid var(--border-dim);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-title {
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8ca89a;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #0b2218;
            border: 1px solid var(--border-dim);
            color: #00ffaa;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        input[type="text"] {
            cursor: text;
        }
        select {
            cursor: pointer;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
            background: #0e2b1f;
        }

        select:disabled {
            background: #05120d;
            color: #5d7568;
            cursor: not-allowed;
        }

        /* ปรับแต่ง input ที่มี list ให้มีลูกศรเหมือน dropdown */
        input[list]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(5) hue-rotate(90deg);
            cursor: pointer;
        }

        .btn-add {
            padding: 12px 20px;
            background: var(--neon-blue);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .btn-add:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            transform: translateY(-2px);
        }

        /* ส่วนแสดง Tag รายการที่เลือก */
        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            min-height: 40px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px dashed var(--border-dim);
        }

        .order-tag {
            background: #0b2218;
            border: 1px solid var(--neon-yellow);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 8px rgba(245, 166, 35, 0.1);
        }

        .order-tag strong {
            color: var(--neon-yellow);
        }

        .order-tag i {
            color: var(--neon-red);
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
            padding: 2px;
        }

        .order-tag i:hover {
            transform: scale(1.3);
        }

        .empty-text {
            color: #5d7568;
            font-size: 14px;
            font-style: italic;
            width: 100%;
            text-align: center;
            margin: 0;
            line-height: 40px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button.btn-action {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-preview {
            background: rgba(0, 229, 255, 0.1);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }
        .btn-preview:hover { background: var(--neon-blue); color: var(--bg-dark); box-shadow: 0 0 15px rgba(0,229,255,0.4); }

        .btn-print {
            background: linear-gradient(135deg, #071910, #040e09);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .btn-print:hover:not(:disabled) { background: var(--neon-green); color: var(--bg-dark); box-shadow: 0 0 15px rgba(0,255,136,0.4); }
        .btn-print:disabled { opacity: 0.5; cursor: not-allowed; }

        #statusMsg {
            text-align: center;
            margin-top: 15px;
            color: #f5a623;
            font-size: 14px;
        }

        /* ========================================================= */
        /* CSS สำหรับพิมพ์ (Print Media) - กระดาษ A4 แนวนอน (Landscape) */
        /* ========================================================= */
        #printArea { display: none; }

        @media print {
            body * { visibility: hidden; }
            body { margin: 0; padding: 0; background: #fff; }
            #printArea, #printArea * { visibility: visible; color: #000 !important; }
            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            @page { size: A4 landscape; margin: 5mm; }

            .page-break { page-break-after: always; }

            .sticker-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(4, 46mm);
                gap: 4mm;
                width: 287mm;
                height: 198mm;
                box-sizing: border-box;
            }

            .sticker-card {
                border: 1px dashed #999;
                padding: 3mm 4mm;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: #fff;
                overflow: hidden;
            }

            .sticker-header-top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .sticker-title h3 {
                margin: 0 0 4px 0;
                font-size: 14px;
                text-align: center;
                font-weight: bold;
                border-bottom: 2px solid #000;
                padding-bottom: 2px;
                margin-bottom: 4px;
            }

            .meta-row {
                font-size: 12px;
                margin-bottom: 4px;
                display: flex;
                align-items: flex-end;
                gap: 4px;
                font-weight: bold;
            }

            .meta-label { white-space: nowrap; margin-bottom: -1px; }
            
            .meta-value {
                border-bottom: 1.5px dotted #000;
                padding-left: 5px;
                min-height: 15px;
                white-space: nowrap; 
            }

            .qr-box { text-align: center; margin-left: 5mm; }
            .qr-box canvas, .qr-box img { width: 55px !important; height: 55px !important; margin: 0 auto; }
            .qr-text-top { display: block; font-size: 8px; font-weight: bold; margin-top: 2px; }
            .qr-code-display { 
                font-size: 14px; 
                font-weight: bold; 
                letter-spacing: 2px; 
                margin-top: 2px; 
                background: #eee; 
                border: 1px solid #000; 
                padding: 2px; 
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-title">
        <h2><i class="fa-solid fa-print"></i> พิมพ์สติ๊กเกอร์หัวกระดาษ (เลือกเฉพาะขั้นตอนได้)</h2>
    </div>

    <div id="statusMsg"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูลระบบ...</div>

    <form id="filterForm" style="display: none;">
        
        <div class="filter-section">
            <div class="filter-title"><i class="fa-solid fa-list-check"></i> ค้นหาและระบุรายการที่ต้องการพิมพ์</div>
            
            <div class="form-row">
                <div class="form-group" style="flex: 1.5;">
                    <label>1. ค้นหา/เลือกเลขที่ใบสั่งงาน</label>
                    <input type="text" id="order_search" list="order_datalist" placeholder="-- พิมพ์ค้นหา หรือเลือกจากรายการ --" onchange="handleOrderSelect()" onclick="this.select()" autocomplete="off">
                    <datalist id="order_datalist"></datalist>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>2. เลือกขั้นตอน (เฉพาะใบนี้)</label>
                    <select id="select_step" disabled>
                        <option value="">-- รอเลือกใบสั่งงาน --</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0.5;">
                    <button type="button" class="btn-add" onclick="addSelectedItem()">
                        <i class="fa-solid fa-plus"></i> เพิ่มรายการ
                    </button>
                </div>
            </div>

            <div class="selected-list" id="selectedList">
                <p class="empty-text">ยังไม่มีรายการที่ถูกเลือก...</p>
            </div>
        </div>

        <div class="action-buttons">
            <button type="button" class="btn-action btn-preview" onclick="preparePrintData()"><i class="fa-solid fa-file-export"></i> ดึงข้อมูล / สร้างสติ๊กเกอร์</button>
            <button type="button" class="btn-action btn-print" id="btnPrint" onclick="window.print()" disabled><i class="fa-solid fa-print"></i> สั่งพิมพ์ทันที</button>
        </div>
        <div id="printCountMsg" style="text-align: center; margin-top: 10px; color: var(--neon-blue); font-weight: bold;"></div>
    </form>
</div>

<div id="printArea"></div>

<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    
    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
    };

    let globalData = { orders: [], targets: [], workItems: [], steps: [], orderSteps: [], shortcutMap: [] };
    
    // อาร์เรย์เก็บข้อมูลที่ถูกเลือก
    let selectedItems = []; 

    window.onload = async function() {
        try {
            const [ordersRes, targetsRes, workItemsRes, stepsRes, orderStepsRes] = await Promise.all([
                fetch(SUPABASE_URL + "/orders?select=*", { headers }),
                fetch(SUPABASE_URL + "/targets?select=*", { headers }),
                fetch(SUPABASE_URL + "/work_items?select=*", { headers }),
                fetch(SUPABASE_URL + "/production_steps?select=*", { headers }),
                fetch(SUPABASE_URL + "/order_steps?select=*", { headers })
            ]);

            if (!ordersRes.ok) throw new Error("Database Fetch Error");

            globalData.orders = await ordersRes.json();
            globalData.targets = await targetsRes.json();
            globalData.workItems = await workItemsRes.json();
            globalData.steps = await stepsRes.json();
            globalData.orderSteps = await orderStepsRes.json();

            // เรียงเลขที่ใบสั่งจากน้อยไปมาก (เก่าไปใหม่)
            globalData.orders.sort((a, b) => String(a.order_no || '').localeCompare(String(b.order_no || ''), 'th', { numeric: true }));

            generateShortcutMap();
            populateOrderSearch();

            document.getElementById('statusMsg').style.display = 'none';
            document.getElementById('filterForm').style.display = 'block';

        } catch (error) {
            console.error(error);
            document.getElementById('statusMsg').innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> โหลดข้อมูลล้มเหลว: " + error.message;
        }
    };

    function generateShortcutMap() {
        globalData.shortcutMap = [];
        let sortedOrders = [...globalData.orders].sort((a,b) => parseInt(a.id_order) - parseInt(b.id_order));
        
        sortedOrders.forEach(order => {
            if (order.id_work) {
                let orderTargets = globalData.targets.filter(t => String(t.id_work) === String(order.id_work));
                orderTargets.sort((a,b) => parseInt(a.id_target) - parseInt(b.id_target));
                
                orderTargets.forEach((target, index) => {
                    let orderPart = String(order.id_order).padStart(3, '0');
                    let stepPart = String(index + 1).padStart(2, '0');
                    
                    globalData.shortcutMap.push({
                        code: orderPart + stepPart, 
                        id_order: order.id_order,
                        id_target: target.id_target
                    });
                });
            }
        });
    }

    function populateOrderSearch() {
        const datalist = document.getElementById('order_datalist');
        datalist.innerHTML = '';
        
        globalData.orders.forEach(o => {
            if (o.order_no) {
                let opt = document.createElement('option');
                opt.value = o.order_no;
                datalist.appendChild(opt);
            }
        });

        // ดึงใบสั่งล่าสุดมาเป็นค่าเริ่มต้น
        if (globalData.orders.length > 0) {
            const latestOrder = globalData.orders[globalData.orders.length - 1]; // ค่าสุดท้ายของ Array ที่เรียงแล้ว
            document.getElementById('order_search').value = latestOrder.order_no;
            handleOrderSelect(); // โหลดขั้นตอนทันที
        }
    }

    // เมื่อค้นหา/เลือกใบสั่งงาน ให้โหลดขั้นตอนของใบสั่งงานนั้นมาแสดง
    function handleOrderSelect() {
        const orderSearchVal = document.getElementById('order_search').value.trim();
        const stepSelect = document.getElementById('select_step');
        
        stepSelect.innerHTML = '<option value="">-- รอเลือกใบสั่งงาน --</option>';
        stepSelect.disabled = true;

        if (!orderSearchVal) return;

        // หา Order ID จากเลขที่ใบสั่ง
        const
